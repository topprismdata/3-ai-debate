topprism:
  purpose: native-ai
  capability: multi_model_deliberation
  platform_layer: organizational-intelligence
  maturity: internal-utility
  evidence:
    type: internal-evaluation
    source: topprism-internal-eval
    scope: >-
      Working examples and protocols present; no rigorous external
      benchmark showing higher decision quality yet.
    status: internal-only
  provenance:
    derived_from: llmcouncil (github.com/rachittshah/llmcouncil)
    modifications: >-
      Replaced API-based providers (OpenAI / Anthropic / Gemini SDK)
      with CLI-based providers (claude, agy, mmx)

business_question:
  en: >-
    When one model's answer is not enough, how can an employee agent
    deliberately seek independent opinions, expose disagreement, and
    synthesize a decision?
  zh: >-
    当单个模型答案不够时，Employee Agent 如何主动征求独立意见、暴露
    分歧、并综合得出决策？

platform:
  system: native-ai
  layer: organizational-intelligence
  solution: multi-model-deliberation

website:
  status: planned
  path: /native-ai/3-ai-debate

repository:
  owner: topprismdata
  public: true
